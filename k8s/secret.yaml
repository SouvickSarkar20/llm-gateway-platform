apiVersion: v1
kind: Secret
metadata:
  name: ai-platform-secrets
  labels:
    app: ai-platform-api
type: Opaque
stringData:
  # In production, inject secrets via ExternalSecrets, SealedSecrets, or AWS Secrets Manager
  JWT_SECRET_KEY: "change-this-in-prod-to-at-least-32-characters-key"
  DATABASE_URL: "postgresql+asyncpg://postgres:postgres@postgres-service.default.svc.cluster.local:5432/chat_platform"
  OPENAI_API_KEY: ""
  GEMINI_API_KEY: ""
