apiVersion: v1
kind: Secret
metadata:
  name: ai-platform-secrets
  labels:
    app: ai-platform-api
type: Opaque
stringData:
  # In production, inject secrets via ExternalSecrets, SealedSecrets, or AWS Secrets Manager
  JWT_SECRET_KEY: "dev_jwt_secret_key_change_in_production_32chars"
  DATABASE_URL: "postgresql+asyncpg://<DB_USER>:<DB_PASSWORD>@postgres-service.default.svc.cluster.local:5432/chat_platform"
  OPENAI_API_KEY: ""
  GEMINI_API_KEY: ""
